name: Feature Request
description: Suggest an idea for RegexSheet (UI, features, etc.)
title: "[Feature]: <Brief description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make RegexSheet better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: checkboxes
    id: volunteer
    attributes:
      label: Are you willing to submit a PR to build this?
      options:
        - label: "Yes, I would like to submit a PR!"
