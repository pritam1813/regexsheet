name: Bug Report
description: Create a report to help us improve RegexSheet
title: "[Bug]: <Brief description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen? Is there an error in our Regex definitions?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (Browser/OS)
      description: e.g., Chrome 116 on Windows 11
  - type: checkboxes
    id: volunteer
    attributes:
      label: Are you willing to submit a PR to fix this?
      options:
        - label: "Yes, I can submit a PR!"
